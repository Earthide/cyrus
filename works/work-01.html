    <h1>CMF 颜色研究</h1>
    <p>跨媒介颜色一致性 / 对色方法 / 数字材质</p>
    <p class="work-summary-description">基于江南大学 CMF 数字化研究创新实验室经历，聚焦屏幕端与实物端颜色匹配、数字化颜色模拟流程、光源与材质对颜色表现的影响分析，以及颜色校正策略输出。</p>
